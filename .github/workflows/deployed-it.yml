name: Reusable Deployed Integration Test

on:
  workflow_call:
    inputs:
      test-class:
        description: Fully qualified Failsafe test class ending in IT
        required: true
        type: string
  workflow_dispatch:
    inputs:
      test-class:
        description: Fully qualified Failsafe test class ending in IT
        required: true
        type: string

jobs:
  deployed-it:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      checks: write
      pull-requests: write
    env:
      SKYVE_DEPLOYED_IT_TEST: ${{ inputs['test-class'] }}
      SKYVE_DEPLOYED_IT_BASE_URL: http://127.0.0.1:8080/skyve/
      SKYVE_DEPLOYED_IT_USERNAME: deployed_it

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up JDK 17
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          java-version: '17'
          distribution: temurin
          cache: maven
      - name: Configure isolated paths
        run: |
          echo "SKYVE_DEPLOYED_IT_RUNTIME_DIR=$RUNNER_TEMP/skyve-wildfly" >> "$GITHUB_ENV"
          echo "SKYVE_DEPLOYED_IT_CONFIG_DIR=$RUNNER_TEMP/skyve-config" >> "$GITHUB_ENV"
          echo "SKYVE_DEPLOYED_IT_CONTENT_DIR=$RUNNER_TEMP/skyve-content" >> "$GITHUB_ENV"
          echo "SKYVE_DEPLOYED_IT_DATABASE_PATH=$RUNNER_TEMP/skyve-database/skyve" >> "$GITHUB_ENV"
      - name: Verify headless browser
        run: |
          google-chrome --version
          java -version
      - name: Prepare isolated configuration
        shell: bash
        run: |
          generated_password=$(openssl rand -hex 24)
          echo "::add-mask::$generated_password"
          echo "SKYVE_DEPLOYED_IT_PASSWORD=$generated_password" >> "$GITHUB_ENV"
          tools/deployed-it/prepare-h2-config.sh
      - name: Prepare approved runtime
        run: tools/deployed-it/prepare-runtime.sh
      - name: Run selected deployed integration test
        run: tools/deployed-it/run.sh
      - name: Test report
        uses: dorny/test-reporter@a6ddd83ac95ff4586f5d3aceeb314d9a1841db95 # v3.0.0
        if: success() || failure()
        with:
          name: Deployed integration test report
          path: '**/target/failsafe-reports/TEST-*.xml'
          reporter: java-junit
      - name: Retain deployed-test diagnostics
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: deployed-it-${{ inputs['test-class'] }}
          if-no-files-found: warn
          path: |
            **/target/failsafe-reports/TEST-*.xml
            skyve-war/target/deployed-it/**/results.md
            skyve-war/target/deployed-it/**/*.log
            skyve-war/target/deployed-it/**/browser/**
