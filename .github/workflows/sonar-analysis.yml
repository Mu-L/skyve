name: Sonar Analysis

on:
  workflow_dispatch:
  schedule:
    # Run at 1pm UTC every Sunday, around 10-11pm Adelaide time
    - cron: '0 13 * * 0'
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  build:

    runs-on: ubuntu-latest

    permissions:
      contents: read
      issues: read
      checks: write
      pull-requests: write

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: 0  # Disable shallow clone for better analysis
    - name: Set up JDK 17
      uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: maven
    - name: Build with Maven
      env:
        SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      run: >-
        mvn -B -Pcoverage -pl skyve-coverage -am
        -DskipIntegrationTests=true -DskipUnitTests=false
        verify org.sonarsource.scanner.maven:sonar-maven-plugin:sonar
    - name: Test Report
      uses: dorny/test-reporter@a6ddd83ac95ff4586f5d3aceeb314d9a1841db95 # v3.0.0
      if: success() || failure()
      with:
        name: Test Report
        path: '**/target/surefire-reports/TEST-*.xml,**/target/failsafe-reports/TEST-*.xml'
        reporter: java-junit
